name: .NET

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, xcode-27]
    steps:
    - name: Install OS dependencies
      if: matrix.os == 'ubuntu-24.04'
      run: sudo apt-get install -y fonts-liberation2 fonts-noto-core fonts-noto-cjk
    - uses: actions/checkout@v4
    - name: Set Xcode version
      if: matrix.os == 'xcode-27'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.2'
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          11.0.x
    - name: Install workloads
      if: matrix.os == 'xcode-27'
      run: dotnet workload install macos --version 11.0.100.1
    - name: Build
      run: dotnet run --project NAPS2.Tools -- build debug -v
    - name: Test
      if: matrix.os != 'xcode-27'
      run: dotnet run --project NAPS2.Tools -- test -v --nogui
    - name: Test (mac)
      if: matrix.os == 'xcode-27'
      run: dotnet run --project NAPS2.Tools -- test -v --nogui --nonetwork
    - name: Test (WPF images)
      if: matrix.os == 'windows-2025'
      run: dotnet run --project NAPS2.Tools -- test -v --nogui --images wpf --scope sdk
    - name: Test (Skia images)
      if: matrix.os == 'ubuntu-24.04'
      run: dotnet run --project NAPS2.Tools -- test -v --nogui --images skia --scope sdk
